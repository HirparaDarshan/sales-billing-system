{% extends 'base.html' %}
{% load static %}
{% block content %}
<h3>Create Sales Bill</h3>

<form method="POST" id="bill-form">
    {% csrf_token %}
    <div class="mb-3">
        <label>Customer</label>
        <select class="form-control typeahead" name="customer" required>
            <option value="">Select Customer</option>
            {% for cust in customers %}
                <option value="{{ cust.id }}">{{ cust.name }} ({{ cust.customer_type }})</option>
            {% endfor %}
        </select>
        <a href="{% url 'create_customer' %}" class="btn btn-sm btn-success mt-1">Add New Customer</a>
    </div>

    <h5>Products</h5>
    <div id="product-container">
        <div class="row mb-2 product-row">
            <div class="col-md-6">
                <select class="form-control typeahead" name="product" required>
                    <option value="">Select Product</option>
                    {% for prod in products %}
                        <option value="{{ prod.id }}">{{ prod.name }} (₹{{ prod.price }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <input type="number" name="quantity" min="1" class="form-control" placeholder="Qty" required>
            </div>
            <div class="col-md-3">
                <button type="button" class="btn btn-danger remove-product">Remove</button>
            </div>
        </div>
    </div>

    <button type="button" class="btn btn-primary mb-3" id="add-product">Add More Products</button>
    <button type="button" class="btn btn-info mb-3" id="review-bill">Review Bill</button>
</form>

<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Bill Review</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <h5 id="modal-total" class="me-auto"></h5>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-success" id="modal-submit">Submit Bill</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<link rel="stylesheet" href="{% static 'core/css/salesbill.css' %}">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
<script src="{% static 'core/js/salesbill.js' %}"></script>
{% endblock %}
