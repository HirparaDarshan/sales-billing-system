{% extends 'base.html' %}
{% load static %}
{% block content %}
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- LEFT SECTION -->
            <div class="col-lg-8">
                <form method="POST" id="bill-form">
                    {% csrf_token %}
                    <input type="hidden"
                           name="items-TOTAL_FORMS"
                           value="0"
                           id="id_items-TOTAL_FORMS">
                    <input type="hidden"
                           name="items-INITIAL_FORMS"
                           value="0"
                           id="id_items-INITIAL_FORMS">
                    <input type="hidden"
                           name="items-MIN_NUM_FORMS"
                           value="0"
                           id="id_items-MIN_NUM_FORMS">
                    <input type="hidden"
                           name="items-MAX_NUM_FORMS"
                           value="1000"
                           id="id_items-MAX_NUM_FORMS">
                    <!-- CUSTOMER CARD -->
                    <div class="card shadow border-0 mb-4">
                        <div class="card-body">
                            <label class="fw-bold fs-5 mb-2">Customer</label>
                            <select class="form-select select2-customer"
                                    name="customer"
                                    data-placeholder="Search Customer..."
                                    required>
                                <option></option>
                                {% for cust in customers %}
                                    <option value="{{ cust.id }}">{{ cust.name }} ({{ cust.customer_type }})</option>
                                {% endfor %}
                            </select>
                            <div class="text-danger small mt-2 customer-error"></div>
                            <a href="{% url 'create_customer' %}"
                               class="btn btn-sm btn-outline-success mt-3">+ Add New Customer</a>
                        </div>
                    </div>
                    <!-- PRODUCT TABLE -->
                    <div class="card shadow border-0">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered text-center align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th style="width:35%">Product</th>
                                            <th>Price</th>
                                            <th>Qty</th>
                                            <th>Subtotal</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="product-container">
                                    </tbody>
                                </table>
                            </div>
                            <button type="button" class="btn btn-outline-primary btn-sm" id="add-product">+ Add Row</button>
                        </div>
                    </div>
                </form>
            </div>
            <!-- SUMMARY -->
            <div class="col-lg-4">
                <div class="card shadow border-0 sticky-summary">
                    <div class="card-body">
                        <h5 class="mb-4">Bill Summary</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Total Items:</span>
                            <span id="total-items">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Grand Total:</span>
                            <span class="fw-bold text-success fs-5" id="grand-total">₹0.00</span>
                        </div>
                        <button type="button" class="btn btn-success w-100" id="review-bill">Review & Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Hidden Template Row -->
    <table class="d-none">
        <tbody>
            <tr id="product-template">
                <td>
                    <select class="form-select product-select select2-product"
                            name="items-__prefix__-product">
                        <option></option>
                        {% for prod in products %}
                            <option value="{{ prod.id }}" data-price="{{ prod.price }}">{{ prod.name }}</option>
                        {% endfor %}
                    </select>
                    <div class="text-danger small product-error"></div>
                </td>
                <td class="price-cell">₹0.00</td>
                <td>
                    <input type="number"
                           min="1"
                           value="1"
                           class="form-control qty-input"
                           name="items-__prefix__-quantity">
                    <div class="text-danger small qty-error"></div>
                </td>
                <td class="subtotal-cell fw-bold">₹0.00</td>
                <td>
                    <input type="hidden" name="items-__prefix__-id" value="">
                    <input type="checkbox" name="items-__prefix__-DELETE" style="display:none;">
                    <button type="button" class="btn btn-sm btn-outline-danger remove-product">✕</button>
                </td>
            </tr>
        </tbody>
    </table>
    <!-- REVIEW MODAL -->
    <div class="modal fade" id="reviewModal">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Invoice Preview</h5>
                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-body"></div>
                <div class="modal-footer">
                    <h5 class="me-auto text-success" id="modal-total"></h5>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Edit</button>
                    <button type="button" class="btn btn-success" id="modal-submit">Confirm</button>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block extra_js %}
    <link href="{% static 'sales/css/salesbill.css' %}" rel="stylesheet">
    <script src="{% static 'sales/js/salesbill.js' %}"></script>
{% endblock %}
