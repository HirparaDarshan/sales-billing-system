{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>Create Product</h4>
            </div>
            <div class="card-body">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Name</label>
                        {{ form.name }}
                    </div>

                    <div class="mb-3">
                        <label>Price</label>
                        {{ form.price }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Save Product
                    </button>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
