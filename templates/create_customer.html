{% load static %}
<div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="createCustomerLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="createCustomerLabel">Add Customer</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form method="POST" id="customerModalForm">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              <div class="text-danger small" id="customer_error_{{ field.name }}"></div>
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-success w-100">Save Customer</button>
        </form>
      </div>
    </div>
  </div>
</div>
