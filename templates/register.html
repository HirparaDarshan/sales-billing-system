{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h3>Register</h3>

        {% if form.errors %}
            <div class="alert alert-danger">
                {{ form.errors }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><label>Username</label>{{ form.username }}</div>
            <div class="mb-3"><label>Password</label>{{ form.password1 }}</div>
            <div class="mb-3"><label>Confirm Password</label>{{ form.password2 }}</div>
            <button type="submit" class="btn btn-success w-100">Register</button>
        </form>
        <p class="mt-3">
            Already have account? <a href="{% url 'login' %}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
